# Cấu hình tiết kiệm RAM cho build trên điện thoại (tránh bị Android kill do hết bộ nhớ)
org.gradle.jvmargs=-Xmx768m -Xms128m -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=64m -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xss2m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# Biên dịch Kotlin ngay trong tiến trình Gradle, không tạo thêm Kotlin daemon (đỡ tốn 1 JVM nữa)
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
org.gradle.daemon=false
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.configureondemand=true
android.enableJetifier=false
