name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle
      - name: Build (retry vì Maven Central thỉnh thoảng báo 429)
        run: |
          chmod +x gradlew
          for i in 1 2 3; do
            ./gradlew assembleDebug --no-daemon && exit 0
            echo "Lần $i thất bại, thử lại sau 30s"; sleep 30
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: NTH_AutoNPC-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
