name: Verify build
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle
      - run: |
          chmod +x gradlew
          for i in 1 2 3; do ./gradlew assembleDebug --no-daemon && exit 0; sleep 30; done; exit 1
